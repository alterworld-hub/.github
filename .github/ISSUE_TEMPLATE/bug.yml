name: Bug
description: Something does not work as expected
type: Bug
projects: ["alterworld-hub/2"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Node, service, version
      placeholder: "local, frontend 0.3.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
