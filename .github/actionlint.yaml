# actionlint 1.7.12 bundles stale metadata for actions/create-github-app-token:
# v3 accepts `client-id` and deprecates `app-id`. Remove once actionlint catches up.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
