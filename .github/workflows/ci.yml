name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    uses: ./.github/workflows/pr-title.yml
    permissions:
      pull-requests: read

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
    permissions:
      contents: read

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo docker.io/rhysd/actionlint:1.7.12 -color
