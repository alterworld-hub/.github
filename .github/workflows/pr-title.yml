name: pr-title

# PR title is a Conventional Commit; PR body references an issue (bots exempt).
on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
      # Body is fetched, not taken from the event: after editing the body, re-run this job.
      - name: issue reference
        if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""')
          if grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)\b:?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+' <<<"$body"; then
            echo "issue reference found"
          else
            echo "::error::PR body must reference an issue: 'Closes #N', 'Closes <owner>/<repo>#N' or 'Refs #N'"
            exit 1
          fi
