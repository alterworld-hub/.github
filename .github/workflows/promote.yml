name: promote

# Release = one immutable artifact per service:
# - image: tag the main-built digest as X.Y.Z, X.Y (no rebuild)
# - chart: package the chart at the release commit with that digest baked in, push as OCI X.Y.Z
on:
  workflow_call:
    inputs:
      image:
        description: Image without tag, e.g. ghcr.io/alterworld-hub/frontend
        type: string
        required: true
      digest:
        description: sha256:... of the built image
        type: string
        required: true
      version:
        description: X.Y.Z
        type: string
        required: true
      ref:
        description: Release commit (chart source)
        type: string
        required: true
      chart-path:
        description: Helm chart dir. Empty = no chart.
        type: string
        default: deploy/chart
    outputs:
      chart:
        value: ${{ jobs.tag.outputs.chart }}

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      chart: ${{ steps.chart.outputs.chart }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag image X.Y.Z and X.Y
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" "$IMAGE@$DIGEST"
          echo "image $IMAGE:$VERSION -> $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - if: inputs.chart-path != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - if: inputs.chart-path != ''
        id: chart
        name: Package chart with pinned image, push OCI
        env:
          CHART: ${{ inputs.chart-path }}
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          yq -i '.image.digest = strenv(DIGEST) | .image.tag = ""' "$CHART/values.yaml"
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" -d dist
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/*.tgz "$registry"
          name=$(yq .name "$CHART/Chart.yaml")
          echo "chart=$registry/$name:$VERSION" >> "$GITHUB_OUTPUT"
          echo "chart $registry/$name:$VERSION (image $DIGEST)" >> "$GITHUB_STEP_SUMMARY"
