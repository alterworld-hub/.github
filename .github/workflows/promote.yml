name: promote

# Release = one immutable artifact per service:
# - image: the image built from the last main commit before the release commit (the release commit
#   only bumps versions, so it is not rebuilt), tagged X.Y.Z, X.Y
# - chart: package the chart at the release commit with that digest baked in, push as OCI X.Y.Z
on:
  workflow_call:
    inputs:
      source-sha:
        description: Commit whose main image (sha-<short>) is released, i.e. the parent of the release commit
        type: string
        required: true
      version:
        description: X.Y.Z
        type: string
        required: true
      ref:
        description: Release commit (chart source)
        type: string
        required: true
      chart-path:
        description: Helm chart dir. Empty = no chart.
        type: string
        default: deploy/chart
    outputs:
      digest:
        value: ${{ jobs.tag.outputs.digest }}
      chart:
        value: ${{ jobs.tag.outputs.chart }}

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.src.outputs.digest }}
      chart: ${{ steps.chart.outputs.chart }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The source image may still be building if the release was merged right after it.
      - id: src
        name: Resolve source image digest (wait up to 10 min)
        env:
          SRC: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"; tag="sha-${SRC:0:7}"
          for _ in $(seq 60); do
            if digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
              echo "image=$image" >> "$GITHUB_OUTPUT"; echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "source $image:$tag -> $digest" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "waiting for $image:$tag"; sleep 10
          done
          echo "::error::$image:$tag not found; was main built for $SRC?"; exit 1

      - name: Tag image X.Y.Z and X.Y
        env:
          IMAGE: ${{ steps.src.outputs.image }}
          DIGEST: ${{ steps.src.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" "$IMAGE@$DIGEST"
          echo "image $IMAGE:$VERSION -> $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - if: inputs.chart-path != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - if: inputs.chart-path != ''
        id: chart
        name: Package chart with pinned image, push OCI
        env:
          CHART: ${{ inputs.chart-path }}
          DIGEST: ${{ steps.src.outputs.digest }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          yq -i '.image.digest = strenv(DIGEST) | .image.tag = ""' "$CHART/values.yaml"
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" -d dist
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/*.tgz "$registry"
          name=$(yq .name "$CHART/Chart.yaml")
          echo "chart=$registry/$name:$VERSION" >> "$GITHUB_OUTPUT"
          echo "chart $registry/$name:$VERSION (image $DIGEST)" >> "$GITHUB_STEP_SUMMARY"
