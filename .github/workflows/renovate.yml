name: renovate

# Self-hosted Renovate as alterworld-hub-bot for every org repo. Config: renovate/config.json.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would change
        type: boolean
        default: false

concurrency:
  group: renovate

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lijfDg2iyvyfLcNj # alterworld-hub-bot
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: alterworld-hub
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate/config.json
          token: ${{ steps.bot.outputs.token }}
          renovate-version: 44.155.9
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: info
